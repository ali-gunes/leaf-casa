services:
  leaf:
    build: .
    container_name: leaf-casa
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-9522}:3000"
    environment:
      - PUBLIC_APP_NAME=${PUBLIC_APP_NAME:-Leaf}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://leaf.casa}
      - PUBLIC_GITHUB_URL=${PUBLIC_GITHUB_URL:-https://github.com/ali-gunes/leaf-casa}
      - PORT=3000
      - DB_PATH=/data/stats.db
      - STATS_USER=${STATS_USER:-admin}
      - STATS_PASSWORD=${STATS_PASSWORD:-}
      - LOG_RAW_IP=${LOG_RAW_IP:-true}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
